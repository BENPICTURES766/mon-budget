<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F1A">

<meta name="mobile-web-app-capable" content="yes">

<title>Mon Budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0F1A'/%3E%3Cpath d='M14 44V30M26 44V20M38 44V26M50 44V14' stroke='%2334D399' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : barre latérale sur ordinateur, barre du bas sur téléphone, contenu en cartes arrondies. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#EDF1F8; --ink:#0B1324; --ink-2:#55627F; --line:#E0E6F1;
  --accent:#047857; --on-accent:#FFFFFF;
  --income:#059669; --expense:#E11D48; --saving:#2563EB; --warn:#B45309;
  --shadow:0 1px 2px rgba(11,19,36,.06),0 10px 28px rgba(11,19,36,.07);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1A; --surface:#121A2B; --surface-2:#1A2540; --ink:#EAF0FF; --ink-2:#93A1C0; --line:#223050;
    --accent:#34D399; --on-accent:#04130D;
    --income:#34D399; --expense:#FB7185; --saving:#60A5FA; --warn:#FBBF24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1A; --surface:#121A2B; --surface-2:#1A2540; --ink:#EAF0FF; --ink-2:#93A1C0; --line:#223050;
  --accent:#34D399; --on-accent:#04130D;
  --income:#34D399; --expense:#FB7185; --saving:#60A5FA; --warn:#FBBF24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);min-height:100vh}
h1,h2,h3,p{margin:0}
h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2);font-size:13.5px}
.ic{display:block;flex:none}

.app{display:flex;min-height:100vh}
.side{display:none;width:240px;flex:none;position:sticky;top:0;height:100vh;padding:26px 14px;border-right:1px solid var(--line);flex-direction:column;gap:4px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:var(--bg)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a[aria-current="page"] .ic{color:var(--accent)}
.side .btn.primary{margin-top:16px}

.main{flex:1;min-width:0;width:100%;max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.head .brand{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
@media (max-width:420px){.head .brand{display:none}.head{justify-content:space-between}}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.monthnav strong{min-width:8.6em;text-align:center;font-weight:700;text-transform:capitalize}
.today-chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--accent)}
.head-right{display:flex;gap:8px;align-items:center}
.icon-btn{border:0;background:transparent;border-radius:99px;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.solid{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--expense)}
.btn.wide{width:100%}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 0}
.bottom a[aria-current="page"]{color:var(--accent)}
.fabslot{display:flex;justify-content:center}
.fab{width:58px;height:58px;border-radius:50%;margin-top:-30px;border:4px solid var(--bg);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
@media (min-width:900px){
  .side{display:flex}
  .bottom,.head .brand,#menu-btn{display:none}
  .main{padding:30px 36px 56px}
  .head{justify-content:flex-end}
}
@media (max-width:899px){#add-desktop{display:none}}

#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:14px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.cards2{grid-template-columns:minmax(0,1fr)}}
.empty{color:var(--ink-2);padding:8px 0}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:13.5px}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner.warn{border-color:var(--warn)}

.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-main{background:linear-gradient(135deg,var(--surface),var(--surface-2));background-image:radial-gradient(520px 220px at 100% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent),linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.hero-amt{font-size:clamp(36px,7vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.hero-amt.neg{color:var(--expense)}
.hero-sub{color:var(--ink-2);margin-top:4px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
@media (max-width:420px){.trio{grid-template-columns:minmax(0,1fr)}}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat-l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.stat-v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat-s{font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ink-2);flex:none}
.dot.income{background:var(--income)} .dot.expense{background:var(--expense)} .dot.saving{background:var(--saving)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.exp>i{background:var(--expense)} .bar.sav>i{background:var(--saving)} .bar.inc>i{background:var(--income)}
.score{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring-in{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ring-in b{font-size:30px;font-weight:800;letter-spacing:-.03em}
.ring-in span{font-size:12px;color:var(--ink-2)}
.parts{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.part{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.part b{color:var(--ink);font-weight:700}

.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none;transform:rotate(-90deg)}
.legend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;min-width:180px}
.legend-list li{display:flex;align-items:center;gap:8px;font-size:14px}
.legend-list .n{flex:1;min-width:0;overflow-wrap:anywhere}
.legend-list .v{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart-wrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-2);font-size:11.5px;font-family:var(--font)}
.chart .axis.now{fill:var(--ink);font-weight:700}
.c-income{fill:var(--income)} .c-expense{fill:var(--expense)} .c-saving{fill:var(--saving)}

.seg{display:inline-flex;background:var(--surface-2);padding:4px;border-radius:12px;gap:2px;max-width:100%}
.seg button,.seg label span{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px;display:block;text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg label{position:relative;display:block}
.seg label input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seg label input:focus-visible+span{outline:2px solid var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.search{flex:1;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}

.day{margin-top:16px}
.day h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding-bottom:4px}
.txs{list-style:none;margin:0;padding:0}
.tx{width:100%;display:flex;align-items:center;gap:12px;padding:11px 8px;margin:0 -8px;border:0;background:transparent;border-radius:12px;text-align:left}
.tx:hover{background:var(--surface-2)}
.badge{width:12px;height:12px;border-radius:50%;flex:none}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-note{font-weight:600;overflow-wrap:anywhere}
.tx-cat{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tx-amt{font-weight:800;white-space:nowrap}
.tx-amt.income{color:var(--income)} .tx-amt.expense{color:var(--expense)} .tx-amt.saving{color:var(--saving)}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.02em}
.tag.soft{background:color-mix(in srgb,var(--saving) 14%,transparent);color:var(--saving)}
.tag.need{background:color-mix(in srgb,var(--income) 14%,transparent);color:var(--income)}
.sum{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:6px}
.sum div{display:flex;flex-direction:column}
.sum b{font-size:20px;font-weight:800;letter-spacing:-.02em}

.brows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.brow-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brow-n{display:flex;align-items:center;gap:9px;font-weight:600;min-width:0;overflow-wrap:anywhere;flex-wrap:wrap}
.lim{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.lim input,.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.lim input{width:96px;text-align:right}
.brow-s{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-top:6px}
.brow.over .bar>i{background:var(--expense)} .brow.over .st{color:var(--expense);font-weight:700}
.brow.near .bar>i{background:var(--warn)} .brow.near .st{color:var(--warn);font-weight:700}
.adj{display:none}
.brow.adjusted .adj{display:inline-flex}
.add-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:560px){.add-row{grid-template-columns:minmax(0,1fr)}}

.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.goal{display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;align-items:center;gap:14px}
.goal-top h3{overflow-wrap:anywhere}
.goal-acts{display:flex;gap:8px;flex-wrap:wrap}
.fund-scale{position:relative}
.fund-scale .tick{position:absolute;left:50%;top:-3px;height:14px;width:2px;background:var(--ink-2)}
.fund-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:6px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.err{color:var(--expense);font-size:13px;min-height:1.2em;font-weight:600}.err:not(:empty){background:var(--expense-bg,rgba(220,60,60,.12));padding:8px 10px;border-radius:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
tbody tr[data-action]{cursor:pointer}
tbody tr[data-action]:hover{background:var(--surface-2)}
tr.future td{color:var(--ink-2);font-style:italic}
tr.total td{font-weight:800;border-bottom:0}
.pos{color:var(--income)} .neg{color:var(--expense)}

.adv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.adv li{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.adv.flat li{background:var(--surface-2);border-color:transparent}
.adv p{color:var(--ink-2);font-size:14.5px}
.pill{align-self:flex-start;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.pill.alert{background:color-mix(in srgb,var(--expense) 16%,transparent);color:var(--expense)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--income) 16%,transparent);color:var(--income)}
.pill.tip{background:color-mix(in srgb,var(--saving) 16%,transparent);color:var(--saving)}
.rec-group h3{margin:4px 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.set-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .t{flex:1;min-width:200px}
.foot{font-size:12.5px;color:var(--ink-2)}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,9,16,.6);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet{align-items:center}}
.sheet-card{background:var(--surface);color:var(--ink);width:min(500px,100%);max-height:94%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
@media (min-width:700px){.sheet-card{border-radius:24px}}
.sheet-card h2{font-size:20px}
.sheet-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet-acts .left{margin-right:auto}
.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-list a{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600}
.menu-list a:hover{background:var(--surface-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;display:flex;gap:16px;align-items:center;z-index:40;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.toast button{background:transparent;border:0;color:inherit;font-weight:800;text-decoration:underline}
@media (min-width:900px){.toast{bottom:28px}}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.imp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.imp-table{min-width:0;font-size:13.5px}
.imp-table th,.imp-table td{text-align:left;white-space:normal;padding:8px 10px}
.imp-table td.a,.imp-table th.a{text-align:right;white-space:nowrap}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.imp-sample{font-size:13px;color:var(--ink-2);text-align:left}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}.sheet-card{animation:up .22s ease}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <aside class="side">
    <div class="logo"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 19v-6M10 19V7M15 19v-9M20 19V4"/></svg></i>Mon Budget</div>
    <nav class="nav" id="side-nav" aria-label="Sections"></nav>
    <button class="btn primary" id="add-side">+ Ajouter un mouvement</button>
  </aside>
  <div class="main">
    <header class="head">

      <div class="monthnav">
        <button class="icon-btn" id="prev" aria-label="Mois précédent"></button>

        <button class="icon-btn" id="next" aria-label="Mois suivant"></button>

<script>
(function(){

];

var NAV=[['home','Accueil','home'],['tx','Mouvements','list'],['rec','Récurrents','repeat'],['budgets','Budgets','pie'],['goals','Épargne','target'],['year','Année','calendar'],['advice','Conseils','bulb'],['settings','Réglages','sliders']];
var BOTTOM=['home','tx','budgets','goals'];

};
function icon(n,s){s=s||22;return '<svg class="ic" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}

/* ====================== Utilitaires ====================== */
var nf2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
var nf0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function eur(n){return nf2.format(n)}
function eur0(n){return nf0.format(Math.round(n))}
function pc(r){return Math.round(r*100)+' %'}
function pad(n){return String(n).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s){return document.querySelector(s)}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function num(s){
  var t=String(s).replace(/[\s\u00a0\u202f€]/g,'');
  if(t.indexOf(',')>-1&&t.indexOf('.')>-1){ if(t.lastIndexOf(',')>t.lastIndexOf('.')) t=t.replace(/\./g,'').replace(',','.'); else t=t.replace(/,/g,''); }
  else t=t.replace(',','.');
  var n=parseFloat(t); return isFinite(n)?n:NaN;
}
function r2(n){return Math.round(n*100)/100}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function monthOf(s){return s.slice(0,7)}
function addMonths(m,k){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function daysIn(m){var p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function monthLabel(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function monthName(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'long'})}
function shortMonth(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}
function dayLabel(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function monthsBetween(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return (y[0]-x[0])*12+(y[1]-x[1])}
var realMonth=monthOf(todayStr());

/* ====================== Données ====================== */
function makeSample(){
  var real=todayStr(), rm=monthOf(real), tx=[], seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var k=-5;k<=0;k++){
    (function(k){
      var m=addMonths(rm,k);
      function add(day,type,cat,amt,note){
        var date=m+'-'+pad(day); if(date>real) return;
        tx.push({id:uid(),type:type,cat:cat,amount:r2(amt),date:date,note:note,goal:''});
      }
      if(k===-3||k===-1) add(15,'income','Primes',180,'Prime');
      add(8,'expense','Courses',70+rnd()*30,'Supermarché');
      add(12,'expense','Restaurants et sorties',42+rnd()*28,'Restaurant');
      add(14,'expense','Courses',70+rnd()*30,'Supermarché');
      add(16,'expense','Loisirs',25+rnd()*40,'Cinéma et sorties');
      add(18,'expense','Transport',25+rnd()*30,'Carburant');
      if(k%2===0) add(19,'expense','Santé',25,'Pharmacie');
      add(21,'expense','Courses',70+rnd()*30,'Supermarché');
      add(23,'expense','Restaurants et sorties',42+rnd()*28,'Restaurant');
      if(k%2!==0) add(24,'expense','Vêtements',40+rnd()*50,'Vêtements');
      add(27,'expense','Courses',60+rnd()*30,'Supermarché');
    })(k);
  }
  var from=addMonths(rm,-5);
  function R(type,cat,amount,note,day,goal){return {id:uid(),type:type,cat:cat,amount:amount,note:note,day:day,from:from,to:'',goal:goal||''}}
  return {
    v:2,sample:true,settings:{theme:'auto'},cats:DEF_CATS.map(function(c){return {n:c.n,need:c.need}}),
    tx:tx,
    rec:[R('income','Salaire',2450,'Salaire',1),R('saving','Épargne',250,'Virement mensuel',2,'g1'),R('saving','Épargne',100,'Virement vacances',2,'g2'),
         R('expense','Logement',780,'Loyer',3),R('expense','Abonnements',13.99,'Streaming',5),R('expense','Abonnements',29.9,'Forfait mobile et internet',6),R('expense','Transport',58.6,'Pass transport',9)],
    recSkip:{},budgets:Object.assign({},DEF_BUDGETS),budgetOv:{},
    goals:[{id:'g1',name:'Fonds d’urgence',target:6000,start:1800,deadline:''},{id:'g2',name:'Vacances été 2027',target:1500,start:300,deadline:'2027-06'}]
  };
}
function emptyState(keep){
  return {v:2,sample:false,settings:keep&&keep.settings?keep.settings:{theme:'auto'},cats:keep&&keep.cats?keep.cats:DEF_CATS.map(function(c){return {n:c.n,need:c.need}}),
    tx:[],rec:[],recSkip:{},budgets:keep&&keep.budgets?keep.budgets:Object.assign({},DEF_BUDGETS),budgetOv:{},goals:[]};
}
function normalize(d){
  var s={v:2,sample:!!d.sample};
  s.settings=Object.assign({theme:'auto'},d.settings||{});
  s.cats=(Array.isArray(d.cats)&&d.cats.length?d.cats:DEF_CATS).filter(function(c){return c&&c.n}).map(function(c){return {n:String(c.n),need:c.need?1:0}});
  if(!s.cats.some(function(c){return c.n==='Autres'})) s.cats.push({n:'Autres',need:0});
  s.tx=(Array.isArray(d.tx)?d.tx:[]).filter(function(x){return x&&typeof x.amount==='number'&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)});
  s.rec=(Array.isArray(d.rec)?d.rec:[]).filter(function(r){return r&&typeof r.amount==='number'&&/^\d{4}-\d{2}$/.test(r.from)});
  s.recSkip=d.recSkip&&typeof d.recSkip==='object'?d.recSkip:{};
  s.budgets=Object.assign({},DEF_BUDGETS,d.budgets||{});
  s.budgetOv=d.budgetOv&&typeof d.budgetOv==='object'?d.budgetOv:{};
  s.goals=Array.isArray(d.goals)?d.goals:[];
  return s;
}
var storageOk=true;
function loadLocal(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.tx)) return normalize(d);}}catch(e){storageOk=false}
  return null;
}
var state=loadLocal()||makeSample();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state)); storageOk=true;}catch(e){storageOk=false;}
  paintBanner();
}
function catColor(n){var i=state.cats.findIndex(function(c){return c.n===n});return PALETTE[(i<0?state.cats.length:i)%PALETTE.length]}
function isNeed(n){var c=state.cats.find(function(c){return c.n===n});return !!(c&&c.need)}
function budgetFor(cat,m){var o=state.budgetOv[m];if(o&&o[cat]!==undefined) return Number(o[cat])||0;return Number(state.budgets[cat])||0}
function hasOverride(cat,m){var o=state.budgetOv[m];return !!(o&&o[cat]!==undefined)}

/* ====================== Calculs ====================== */
function occ(r,m){
  return {id:'r:'+r.id+':'+m,recId:r.id,rec:true,type:r.type,cat:r.cat,amount:r.amount,date:m+'-'+pad(Math.min(r.day||1,daysIn(m))),note:r.note||'',goal:r.goal||''};
}
function recActive(r,m){return r.from<=m&&(!r.to||m<=r.to)&&!state.recSkip[r.id+'|'+m]}
function monthTx(m){
  var out=state.tx.filter(function(x){return monthOf(x.date)===m}).reverse();
  state.rec.forEach(function(r){if(recActive(r,m)) out.push(occ(r,m));});
  return out;
}
function eachTxUpTo(upTo,fn){
  state.tx.forEach(function(x){if(x.date<=upTo) fn(x)});
  var last=monthOf(upTo);
  state.rec.forEach(function(r){
    var m=r.from, end=(r.to&&r.to<last)?r.to:last, n=0;
    while(m<=end&&n<600){ if(!state.recSkip[r.id+'|'+m]){var x=occ(r,m); if(x.date<=upTo) fn(x);} m=addMonths(m,1); n++; }
  });
}
function monthTotals(m){
  var t={income:0,expense:0,saving:0,byCat:{},nIncome:0,upcoming:0}, today=todayStr();
  monthTx(m).forEach(function(x){
    t[x.type]+=x.amount;
    if(x.type==='income') t.nIncome++;
    if(x.type==='expense'){t.byCat[x.cat]=(t.byCat[x.cat]||0)+x.amount; if(x.date>today) t.upcoming+=x.amount;}
  });
  return t;
}
function goalSaved(g){
  var s=Number(g.start)||0, today=todayStr();
  eachTxUpTo(today,function(x){if(x.type==='saving'&&x.goal===g.id) s+=x.amount});
  return s;
}
function goalMonth(g,m){
  return monthTx(m).filter(function(x){return x.type==='saving'&&x.goal===g.id}).reduce(function(s,x){return s+x.amount},0);
}
function totalSaved(){
  var ids={}; state.goals.forEach(function(g){ids[g.id]=1});
  var free=0; eachTxUpTo(todayStr(),function(x){if(x.type==='saving'&&!ids[x.goal]) free+=x.amount});
  return state.goals.reduce(function(s,g){return s+goalSaved(g)},0)+free;
}
function avgMonthlyExpense(){
  var vals=[];
  for(var k=-1;k>=-3;k--){var e=monthTotals(addMonths(realMonth,k)).expense; if(e>0) vals.push(e);}
  if(vals.length) return vals.reduce(function(a,b){return a+b},0)/vals.length;
  return monthTotals(realMonth).expense;
}
function forecast(){
  if(cur!==realMonth) return null;
  var today=todayStr(), dom=Number(today.slice(8)), dim=daysIn(cur);
  var inc=0,sav=0,spent=0,upcoming=0,varSpent=0;
  monthTx(cur).forEach(function(x){
    if(x.type==='income') inc+=x.amount;
    else if(x.type==='saving') sav+=x.amount;
    else if(x.date<=today){spent+=x.amount; if(!x.rec) varSpent+=x.amount;}
    else upcoming+=x.amount;
  });
  var varProj=varSpent/Math.max(1,dom)*(dim-dom);
  var projExp=spent+upcoming+varProj;
  return {incomeAll:inc,projExp:projExp,balance:inc-projExp-sav,upcoming:upcoming,varProj:varProj,spent:spent,left:dim-dom};
}
function budgetTotals(m,t){
  var lim=0,over=0,counted=0,ok=0;
  state.cats.forEach(function(c){var l=budgetFor(c.n,m); lim+=l; if(l>0){counted++; if((t.byCat[c.n]||0)<=l) ok++; else over++;}});
  return {lim:lim,over:over,counted:counted,ok:ok};
}
function budgetStatus(cat,m,t){
  var lim=budgetFor(cat,m), sp=t.byCat[cat]||0;
  var pct=lim>0?Math.min(100,sp/lim*100):0;
  var cls=lim<=0?'':sp>lim?'over':sp>=lim*0.85?'near':'';
  var text=lim<=0?'Pas de plafond':sp>lim?'Dépassé de '+eur(sp-lim):'Reste '+eur(lim-sp);
  return {lim:lim,sp:sp,pct:pct,cls:cls,text:text};
}
function healthScore(){
  var t=monthTotals(cur); if(t.income<=0) return null;
  var parts=[], total=0;
  var sr=Math.max(0,t.saving/t.income), p1=Math.round(Math.min(1,sr/0.2)*35);
  parts.push({l:'Épargne',v:p1,max:35}); total+=p1;
  var p2=t.expense<=t.income*0.8?25:t.expense<=t.income?15:0;
  parts.push({l:'Équilibre revenus et dépenses',v:p2,max:25}); total+=p2;
  var bt=budgetTotals(cur,t), p3=bt.counted?Math.round(bt.ok/bt.counted*25):12;
  parts.push({l:'Respect des budgets',v:p3,max:25}); total+=p3;
  var avg=avgMonthlyExpense(), cov=avg>0?totalSaved()/avg:0, p4=Math.round(Math.min(1,cov/3)*15);
  parts.push({l:'Matelas de sécurité',v:p4,max:15}); total+=p4;
  var label=total<40?'À renforcer':total<65?'Correct':total<85?'Solide':'Excellent';
  return {score:total,label:label,parts:parts};
}

/* ====================== Conseils ====================== */
function adviceList(){
  var out=[], t=monthTotals(cur), inc=t.income;
  function push(lv,title,text){out.push({lv:lv,title:title,text:text})}
  if(t.income+t.expense+t.saving===0){
    push('tip','Commencez par noter vos mouvements','Ajoutez vos revenus et vos dépenses du mois avec le bouton +. Placez votre salaire, votre loyer et vos abonnements en récurrent : ils se répètent sur tous les mois.');
  }else{
    if(inc===0){
      push('warn','Aucun revenu pour ce mois','Ajoutez vos revenus (en récurrent pour le salaire) afin de calculer votre taux d’épargne et votre reste à vivre.');
    }else{
      if(t.expense>inc) push('alert','Vos dépenses dépassent vos revenus','Ce mois-ci, les dépenses dépassent les revenus de '+eur(t.expense-inc)+'. L’onglet Budgets montre les catégories les plus lourdes : fixez-leur un plafond.');
      else if(t.expense+t.saving>inc) push('warn','Dépenses et épargne dépassent vos revenus','Il manque '+eur(t.expense+t.saving-inc)+' pour tout financer ce mois-ci. Réduisez une dépense de confort ou répartissez un versement d’épargne.');
      var r=t.saving/inc;
      if(r<0.10) push('warn','Taux d’épargne de '+pc(r),'Un premier palier réaliste est 10 % des revenus, soit '+eur(inc*0.10)+' par mois. Programmez un virement récurrent le jour de la paie.');
      else if(r<0.20) push('tip','Taux d’épargne de '+pc(r)+' : bon début','Pour atteindre 20 % ('+eur(inc*0.2)+'), il manque '+eur(inc*0.2-t.saving)+' par mois.');
      else push('good','Taux d’épargne de '+pc(r)+' : bravo','Vous atteignez ou dépassez le repère de 20 % des revenus. Gardez ce rythme.');
      var needs=0; Object.keys(t.byCat).forEach(function(c){if(isNeed(c)) needs+=t.byCat[c]});
      var wants=t.expense-needs;
      if(needs/inc>0.5) push('warn','Dépenses essentielles à '+pc(needs/inc),'Elles dépassent le repère de 50 % des revenus. Comparez vos contrats (énergie, assurances, forfaits) pour alléger ce poste.');
      if(wants/inc>0.3){
        var top=Object.keys(t.byCat).filter(function(c){return !isNeed(c)}).sort(function(a,b){return t.byCat[b]-t.byCat[a]})[0];
        push('warn','Dépenses de confort à '+pc(wants/inc),'Le repère est 30 % des revenus.'+(top?' Le poste le plus lourd est '+top+' ('+eur(t.byCat[top])+').':''));
      }
      var abo=t.byCat['Abonnements']||0;
      if(abo/inc>0.05) push('tip','Abonnements à '+pc(abo/inc)+' des revenus','Faites le tri : résiliez ce que vous n’avez pas utilisé depuis 2 mois. Chaque 10 € économisés par mois font 120 € par an.');
    }
    var over=[],near=[];
    state.cats.forEach(function(c){
      var l=budgetFor(c.n,cur), s=t.byCat[c.n]||0;
      if(l>0){ if(s>l) over.push(c.n+' : +'+eur(s-l)); else if(s>=l*0.85) near.push(c.n+' : '+pc(s/l)+' du plafond'); }
    });
    if(over.length) push('alert',over.length===1?'Un budget est dépassé':over.length+' budgets sont dépassés',over.join(' · ')+'. Ajustez le plafond si le besoin est réel, sinon freinez les achats restants.');
    if(near.length) push('warn','Plafond bientôt atteint',near.join(' · ')+'.');
    var f=forecast();
    if(f&&inc>0){
      if(f.balance<0) push('alert','Fin de mois sous tension','Au rythme actuel, il manquerait environ '+eur0(-f.balance)+' en fin de mois. Ralentissez les dépenses variables (courses, sorties, loisirs).');
      else if(f.balance<inc*0.05) push('warn','Fin de mois serrée','Au rythme actuel, il resterait environ '+eur0(f.balance)+' en fin de mois, soit une marge très faible.');
    }
    if(cur<realMonth){
      var p=monthTotals(addMonths(cur,-1));
      if(p.expense>0&&t.expense>p.expense*1.1){
        var best=null,bd=0;
        state.cats.forEach(function(c){var d=(t.byCat[c.n]||0)-(p.byCat[c.n]||0); if(d>bd){bd=d;best=c.n;}});
        push('tip','Dépenses en hausse de '+pc(t.expense/p.expense-1)+' sur un mois','Total : '+eur(t.expense)+' contre '+eur(p.expense)+'.'+(best?' La plus forte hausse vient de '+best+' (+'+eur(bd)+').':''));
      }
    }
  }
  var avg=avgMonthlyExpense(), saved=totalSaved();
  if(avg>0){
    var cov=saved/avg, cvTxt=cov.toLocaleString('fr-FR',{maximumFractionDigits:1});
    if(cov<1) push('alert','Matelas de sécurité : '+cvTxt+' mois de dépenses','Visez d’abord 3 mois de dépenses, soit environ '+eur0(avg*3)+'. Gardez cet argent disponible et sans risque, par exemple sur un livret réglementé.');
    else if(cov<3) push('warn','Matelas de sécurité : '+cvTxt+' mois de dépenses','Il manque environ '+eur0(avg*3-saved)+' pour atteindre 3 mois de dépenses ('+eur0(avg*3)+').');
    else if(cov<=6) push('good','Matelas de sécurité solide : '+cvTxt+' mois','Vous couvrez au moins 3 mois de dépenses. Au-delà de 6 mois ('+eur0(avg*6)+'), l’épargne peut servir d’autres projets.');
    else push('tip','Au-delà de 6 mois de dépenses','Votre précaution est large. L’épargne en plus peut financer des projets de long terme. Comparez les supports et demandez conseil pour votre situation avant de placer.');
  }
  state.goals.forEach(function(g){
    var s=goalSaved(g), target=Number(g.target)||0, rest=target-s;
    if(target<=0) return;
    if(rest<=0){ push('good','Objectif atteint : '+g.name,'Vous avez réuni '+eur0(s)+' sur '+eur0(target)+'.'); return; }
    if(g.deadline){
      var n=monthsBetween(realMonth,g.deadline);
      if(n<=0){ push('warn','Échéance dépassée : '+g.name,'Il reste '+eur0(rest)+' à réunir. Repoussez la date ou augmentez vos versements.'); return; }
      var need=rest/n, done=goalMonth(g,cur);
      if(done<need*0.9) push('tip',g.name+' : '+eur0(need)+' par mois à prévoir','Il reste '+eur0(rest)+' à réunir pour '+monthLabel(g.deadline)+'. Versé ce mois-ci : '+eur0(done)+'. Un versement récurrent règle la question.');
      else push('good',g.name+' : bon rythme','Il reste '+eur0(rest)+' pour '+monthLabel(g.deadline)+'. Vos versements couvrent les '+eur0(need)+' par mois nécessaires.');
    }
  });
  return out.map(function(a,i){return {a:a,i:i}}).sort(function(x,y){return LEVEL_ORDER[x.a.lv]-LEVEL_ORDER[y.a.lv]||x.i-y.i}).map(function(o){return o.a});

function ring(pct,color,size,stroke,inner){
  var r=(size-stroke)/2, c=2*Math.PI*r, p=Math.max(0,Math.min(1,pct)), h=size/2;
  var s='<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true"><circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+stroke+'"/>';
  if(p>0) s+='<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 '+h+' '+h+')"/>';
  return s+'</svg><div class="ring-in">'+inner+'</div></div>';
}
function donutHtml(t){
  var keys=Object.keys(t.byCat).sort(function(a,b){return t.byCat[b]-t.byCat[a]});
  if(!keys.length) return '<p class="empty">Aucune dépense ce mois-ci.</p>';

  var segs=keys.map(function(k){
    var pct=t.byCat[k]/t.expense*100;
    var s='<circle r="15.9155" cx="21" cy="21" fill="none" stroke="'+catColor(k)+'" stroke-width="5" stroke-dasharray="'+Math.max(0,pct-0.6)+' '+(100-Math.max(0,pct-0.6))+'" stroke-dashoffset="'+(25-acc)+'"><title>'+esc(k)+' : '+esc(eur(t.byCat[k]))+'</title></circle>';
    acc+=pct; return s;
  }).join('');
  var legend=keys.map(function(k){
    return '<li><i class="dot" style="background:'+catColor(k)+'"></i><span class="n">'+esc(k)+'</span><span class="v num">'+eur0(t.byCat[k])+'</span><span class="muted num">'+pc(t.byCat[k]/t.expense)+'</span></li>';
  }).join('');
  return '<div class="donut-wrap"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Répartition des dépenses par catégorie"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--surface-2)" stroke-width="5"/>'+segs+'</svg><ul class="legend-list">'+legend+'</ul></div>';
}
function barsHtml(months,highlight){
  var data=months.map(function(m){return {m:m,t:monthTotals(m)}});
  var max=Math.max.apply(null,[0].concat(data.map(function(d){return Math.max(d.t.income,d.t.expense,d.t.saving)})));
  if(max===0) return '<p class="empty">Aucune donnée sur cette période.</p>';
  var unit=max<1500?100:max<4000?250:500, top=Math.ceil(max/(unit*4))*unit*4;
  var W=680,H=250,L=52,R=8,T=10,B=30,pw=W-L-R,ph=H-T-B,n=months.length,gw=pw/n;
  var bw=Math.min(22,(gw-12)/3), gap=3, off=(gw-(bw*3+gap*2))/2;
  function y(v){return T+ph-(v/top)*ph}
  function lab(v){return v>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' k€':Math.round(v)+' €'}
  var s='<svg class="chart" style="min-width:'+Math.max(360,n*62)+'px" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenus, dépenses et épargne par mois">';
  for(var i=0;i<=4;i++){var v=top*i/4; s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="axis" x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+lab(v)+'</text>';}
  data.forEach(function(d,i){
    var x0=L+i*gw+off;
    [['income','Revenus',d.t.income],['expense','Dépenses',d.t.expense],['saving','Épargne',d.t.saving]].forEach(function(b,j){
      var h=Math.max(0,(b[2]/top)*ph);
      s+='<rect class="c-'+b[0]+'" x="'+(x0+j*(bw+gap))+'" y="'+(T+ph-h)+'" width="'+bw+'" height="'+h+'" rx="3"><title>'+esc(monthLabel(d.m))+' : '+b[1]+' '+esc(eur(b[2]))+'</title></rect>';
    });
    s+='<text class="axis'+(d.m===highlight?' now':'')+'" x="'+(L+i*gw+gw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(shortMonth(d.m))+'</text>';
  });
  s+='</svg>';
  return '<div class="legend"><span><i class="dot income"></i>Revenus</span><span><i class="dot expense"></i>Dépenses</span><span><i class="dot saving"></i>Épargne</span></div><div class="chart-wrap">'+s+'</div>';
}

  var free=0; eachTxUpTo(todayStr(),function(x){if(x.type==='saving'&&!ids[x.goal]) free+=x.amount});
  return free;
}
function viewGoals(){
  var avg=avgMonthlyExpense(), saved=totalSaved(), cov=avg>0?saved/avg:null, free=freeSaved();
  var fund='<section class="card"><div class="card-h"><h2>Mon épargne</h2></div>'+
    '<div class="sum"><div><span class="muted">Épargne totale</span><b class="num">'+eur0(saved)+'</b></div>'+(free>0?'<div><span class="muted">Dont épargne libre</span><b class="num">'+eur0(free)+'</b></div>':'')+(cov!==null?'<div><span class="muted">Couverture</span><b class="num">'+cov.toLocaleString('fr-FR',{maximumFractionDigits:1})+' mois</b></div><div><span class="muted">Dépenses moyennes</span><b class="num">'+eur0(avg)+'</b></div>':'')+'</div>'+
    (cov===null?'<p class="muted">Saisissez quelques dépenses pour mesurer combien de mois de dépenses votre épargne couvre (matelas de sécurité).</p>':
    '<div class="fund-scale"><div class="bar sav"><i style="width:'+Math.min(100,cov/6*100)+'%"></i></div><span class="tick" aria-hidden="true"></span></div>'+
    '<div class="fund-labels"><span>0</span><span>3 mois : '+eur0(avg*3)+'</span><span>6 mois : '+eur0(avg*6)+'</span></div>')+'</section>';
  var cards=state.goals.map(function(g){
    var s=goalSaved(g), target=Number(g.target)||0, p=target>0?Math.min(1,s/target):0, rest=Math.max(0,target-s), meta='';
    if(rest===0&&target>0) meta='Objectif atteint';
    else{
      var eta=etaFor(g,rest), parts=[];
      if(g.deadline){var n=monthsBetween(realMonth,g.deadline); parts.push(n>0?'D’ici '+monthLabel(g.deadline)+' : ≈ '+eur0(rest/n)+' par mois':'Échéance '+monthLabel(g.deadline)+' dépassée');}
      else parts.push('Il reste '+eur0(rest));

      '<div class="goal-acts"><button class="btn sm primary" data-action="contrib" data-id="'+esc(g.id)+'">Verser</button><button class="btn sm" data-action="goal-edit" data-id="'+esc(g.id)+'">Modifier</button><button class="btn sm danger" data-action="goal-del" data-id="'+esc(g.id)+'">'+(delArmed?'Confirmer':'Supprimer')+'</button></div></article>';
  }).join('');
  var ge=goalEdit?state.goals.find(function(g){return g.id===goalEdit}):null;
  var form='<section class="card" id="goal-card"><h2 style="margin-bottom:12px">'+(ge?'Modifier l’objectif':'Nouvel objectif')+'</h2><form id="goal-form" novalidate><div class="form-grid">'+
    '<div class="field"><label for="goal-name">Nom</label><input id="goal-name" maxlength="40" autocomplete="off" placeholder="Ex. Voyage, apport, voiture" value="'+(ge?esc(ge.name):'')+'"></div>'+
    '<div class="field"><label for="goal-target">Montant visé (€)</label><input id="goal-target" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(ge?ge.target:'')+'"></div>'+
    '<div class="field"><label for="goal-start">Déjà épargné (€)</label><input id="goal-start" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(ge&&ge.start?ge.start:'')+'"></div>'+
    '<div class="field"><label for="goal-deadline">Échéance (facultatif)</label><input id="goal-deadline" type="month" placeholder="2027-06" value="'+(ge?esc(ge.deadline||''):'')+'"></div>'+
    '<div class="goal-acts"><button class="btn primary" type="submit">'+(ge?'Enregistrer':'Créer l’objectif')+'</button>'+(ge?'<button class="btn" type="button" data-action="goal-cancel">Annuler</button>':'')+'</div></div><p class="err" id="goal-err" role="alert"></p></form></section>';
  return fund+'<div class="goals">'+(cards||'<section class="card"><p class="empty">Aucun objectif. Créez-en un ci-dessous.</p></section>')+'</div>'+form;

function viewYear(){

    var t=monthTotals(m), bal=t.income-t.expense-t.saving, future=m>realMonth, empty=t.income+t.expense+t.saving===0;
    tot.income+=t.income; tot.expense+=t.expense; tot.saving+=t.saving;
    return '<tr data-action="go-month" data-m="'+m+'" class="'+(future?'future':'')+'"><td style="text-transform:capitalize">'+esc(monthName(m))+(future&&!empty?' (prévu)':'')+'</td><td class="num">'+(empty?'—':eur0(t.income))+'</td><td class="num">'+(empty?'—':eur0(t.expense))+'</td><td class="num">'+(empty?'—':eur0(t.saving))+'</td><td class="num '+(bal<0?'neg':'pos')+'">'+(empty?'—':eur0(bal))+'</td><td class="num">'+(t.income>0?pc(t.saving/t.income):'—')+'</td></tr>';
  }).join('');
  var balT=tot.income-tot.expense-tot.saving;
  var best=null; months.forEach(function(m){var t=monthTotals(m); if(t.income>0&&(!best||t.saving>best.s)) best={m:m,s:t.saving}});

  return '<section class="card"><div class="card-h"><h2>Bilan de l’année</h2>'+nav+'</div>'+

    (tot.income>0?'<p class="muted">Taux d’épargne sur l’année : '+pc(tot.saving/tot.income)+(best&&best.s>0?'. Meilleur mois d’épargne : '+esc(monthName(best.m))+' ('+eur0(best.s)+').':'.')+'</p>':'')+'</section>'+

    '<section class="card"><div class="card-h"><h2>Tableau</h2><span class="muted">Touchez un mois pour l’ouvrir. Les mois à venir sont basés sur vos récurrents.</span></div><div class="table-wrap"><table><thead><tr><th>Mois</th><th>Revenus</th><th>Dépenses</th><th>Épargne</th><th>Solde</th><th>Taux</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr class="total"><td>Total</td><td class="num">'+eur0(tot.income)+'</td><td class="num">'+eur0(tot.expense)+'</td><td class="num">'+eur0(tot.saving)+'</td><td class="num '+(balT<0?'neg':'pos')+'">'+eur0(balT)+'</td><td class="num">'+(tot.income>0?pc(tot.saving/tot.income):'—')+'</td></tr></tfoot></table></div></section>';

function applyTheme(){
  var t=state.settings.theme, r=document.documentElement;
  if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
}
function toast(msg,undo){
  var el=$('#toast'); el.innerHTML='<span></span>'; el.firstChild.textContent=msg;
  if(undo){var b=document.createElement('button');b.textContent='Annuler';b.onclick=function(){undo();el.hidden=true;};el.appendChild(b);}
  el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.hidden=true},6000);
}
function mutate(fn,msg,norender){
  var snap=JSON.stringify(state);
  fn(); save(); if(!norender) render();
  if(msg) toast(msg,function(){state=normalize(JSON.parse(snap));save();render();});
}

var repeatTouched=false;
var REPEAT_HELP={
  none:'Ce mouvement ne concerne que le mois choisi.',
  forward:'Il sera ajouté automatiquement chaque mois à partir du mois choisi. Vous pourrez le modifier dans Récurrents.',
  back:'Il sera ajouté sur tous les mois, y compris les 12 mois précédents et tous les mois à venir.'
};
function paintRepeatHelp(){$('#f-repeat-help').textContent=REPEAT_HELP[$('#f-repeat').value]||''}
function setType(t){
  form.querySelector('input[name=type][value='+t+']').checked=true;
  fillCats(t); $('#f-goal-wrap').hidden=t!=='saving';
}
function openSheet(o){
  o=o||{};
  var type=o.type||'expense', v={amount:'',note:'',cat:'',goal:o.goal||'',date:(realMonth===cur)?todayStr():cur+'-01'};
  ed={mode:'new'};
  if(o.tx){ed={mode:'tx',tx:o.tx};type=o.tx.type;v={amount:String(o.tx.amount).replace('.',','),note:o.tx.note||'',cat:o.tx.cat,goal:o.tx.goal||'',date:o.tx.date};}
  if(o.rec){ed={mode:'rec',rec:o.rec,month:o.month};type=o.rec.type;var x=occ(o.rec,o.month);v={amount:String(o.rec.amount).replace('.',','),note:o.rec.note||'',cat:o.rec.cat,goal:o.rec.goal||'',date:x.date};}
  setType(type);
  $('#f-goal').innerHTML='<option value="">Épargne libre, sans objectif</option>'+state.goals.map(function(g){return '<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>'}).join('');
  $('#f-goal').value=v.goal;
  if(v.cat){var sel=$('#f-cat'); if(!Array.prototype.some.call(sel.options,function(op){return op.value===v.cat})){sel.insertAdjacentHTML('beforeend','<option>'+esc(v.cat)+'</option>');} sel.value=v.cat;}
  $('#f-amount').value=v.amount; $('#f-note').value=v.note; $('#f-date').value=v.date; $('#f-err').textContent='';
  repeatTouched=false;
  $('#f-repeat').value=(o.repeat||type!=='expense')?'forward':'none';
  paintRepeatHelp();
  $('#f-repeat-wrap').hidden=ed.mode!=='new';
  $('#f-scope-wrap').hidden=ed.mode!=='rec';
  form.querySelector('input[name=scope][value=forward]').checked=true;
  $('#f-delete').hidden=ed.mode==='new';
  $('#sheet-title').textContent=ed.mode==='new'?(o.repeat?'Nouvelle opération récurrente':'Nouveau mouvement'):ed.mode==='tx'?'Modifier le mouvement':'Modifier l’opération récurrente';
  lastFocus=document.activeElement; sheet.hidden=false;
  setTimeout(function(){$('#f-amount').focus()},0);
}
function closeSheet(){sheet.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus();}
function splitRec(r,m){
  var n=Object.assign({},r,{id:uid(),from:m}); r.to=addMonths(m,-1);
  Object.keys(state.recSkip).forEach(function(k){var p=k.split('|'); if(p[0]===r.id&&p[1]>=m){delete state.recSkip[k]; state.recSkip[n.id+'|'+p[1]]=1;}});
  state.rec.push(n); return n;
}
form.addEventListener('change',function(e){
  if(e.target.name==='type'){
    setType(e.target.value);
    if(!repeatTouched&&ed.mode==='new'){$('#f-repeat').value=e.target.value==='expense'?'none':'forward';paintRepeatHelp();}
  }
  else if(e.target.id==='f-repeat'){repeatTouched=true;paintRepeatHelp();}
});
form.addEventListener('submit',function(e){
  e.preventDefault();
  var type=form.querySelector('input[name=type]:checked').value, amount=num($('#f-amount').value), date=$('#f-date').value, err=$('#f-err');
  function bad(m,el){err.textContent=m;try{err.scrollIntoView({block:'nearest'});if(el)el.focus();}catch(x){}}
  if(!(amount>0)){bad('Saisissez un montant supérieur à 0 (exemple : 1500 ou 1500,50).',$('#f-amount'));return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){bad('Choisissez une date.',$('#f-date'));return;}
  var v={type:type,cat:type==='saving'?'Épargne':$('#f-cat').value,amount:r2(amount),date:date,note:$('#f-note').value.trim().slice(0,80),goal:type==='saving'?$('#f-goal').value:''};
  var scope=form.querySelector('input[name=scope]:checked').value, repeat=$('#f-repeat').value, goTo=monthOf(date);
  var wasNewRec=false;
  err.textContent='';
  try{
  mutate(function(){
    if(ed.mode==='new'){
      if(repeat!=='none'){state.rec.push({id:uid(),type:v.type,cat:v.cat,amount:v.amount,note:v.note,day:Number(date.slice(8)),from:repeat==='back'?addMonths(monthOf(date),-12):monthOf(date),to:'',goal:v.goal}); wasNewRec=true;}
      else state.tx.push({id:uid(),type:v.type,cat:v.cat,amount:v.amount,date:v.date,note:v.note,goal:v.goal});
    }else if(ed.mode==='tx'){
      Object.assign(ed.tx,{type:v.type,cat:v.cat,amount:v.amount,date:v.date,note:v.note,goal:v.goal});
    }else{
      var r=ed.rec, m=ed.month; goTo=m;
      if(scope==='one'){
        state.recSkip[r.id+'|'+m]=1;
        state.tx.push({id:uid(),type:v.type,cat:v.cat,amount:v.amount,date:v.date,note:v.note,goal:v.goal});
      }else{
        var target=r.from===m?r:splitRec(r,m);
        Object.assign(target,{type:v.type,cat:v.cat,amount:v.amount,note:v.note,goal:v.goal,day:Number(date.slice(8))});
      }
    }
  },null,true);
  }catch(x){ closeSheet(); try{render();}catch(y){} toast('Enregistré, mais un affichage a échoué : '+(x&&x.message||x)); return; }
  if(ed.mode==='rec'||tab!=='rec'){cur=goTo;}
  closeSheet();
  try{render();}catch(x){toast('Enregistré (affichage à rafraîchir : rechargez la page)');return;}
  toast(wasNewRec?'Ajouté sur tous les mois (modifiable dans Récurrents)':'Enregistré');
});
$('#f-delete').addEventListener('click',function(){
  var scope=form.querySelector('input[name=scope]:checked').value, e0=ed;
  closeSheet();
  mutate(function(){
    if(e0.mode==='tx'){state.tx=state.tx.filter(function(x){return x!==e0.tx&&x.id!==e0.tx.id});}
    else{
      var r=e0.rec, m=e0.month;
      if(scope==='one') state.recSkip[r.id+'|'+m]=1;
      else if(r.from>=m){state.rec=state.rec.filter(function(x){return x.id!==r.id}); Object.keys(state.recSkip).forEach(function(k){if(k.split('|')[0]===r.id) delete state.recSkip[k]});}
      else r.to=addMonths(m,-1);
    }
  },'Supprimé');
});

function csvEscape(s){s=String(s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function download(name,text,mime){
  try{
    var blob=new Blob([text],{type:mime}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
    return true;
  }catch(e){return false}
}
function goTab(id){
  if(!views[id]) return; tab=id; armed=null; goalEdit=null;
  try{if(location.hash!=='#'+id) location.hash=id;}catch(e){}
  render(); window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-tab]');
  if(a){e.preventDefault();goTab(a.dataset.tab);return;}
  var el=e.target.closest('[data-action]'); if(!el) return;
  var act=el.dataset.action, id=el.dataset.id;
  if(act==='add'){openSheet();}
  else if(act==='imp-open'){impOpen();}
  else if(act==='imp-close'){impClose();}
  else if(act==='imp-run'){impRun();}
  else if(act==='filter'){filter=el.dataset.v;render();}
  else if(act==='edit-tx'){
    if(id.indexOf('r:')===0){var p=id.split(':'), r=state.rec.find(function(x){return x.id===p[1]}); if(r) openSheet({rec:r,month:p[2]});}

    files[name]={method:method,csize:csize,lho:lho};
    p+=46+nlen+elen+clen;

    names:Object.keys(files),

      var f=files[name]; if(!f) return null;
      var nl=dv.getUint16(f.lho+26,true), el=dv.getUint16(f.lho+28,true), start=f.lho+30+nl+el;

  });
  var sum=items.reduce(function(s,x){return s+x.amount},0);
  return {items:items,skipped:skipped,undated:undated,newCats:newCats,sum:sum};
}
function impBodyHtml(){
  if(!imp){
    return (impErr?'<p class="err" role="alert">'+esc(impErr)+'</p>':'')+
      '<div class="drop"><p>Déposez ici votre fichier Excel (.xlsx) ou CSV, ou choisissez-le.</p><label class="btn primary" for="imp-file">Choisir un fichier</label><input id="imp-file" class="sr" type="file" accept=".xlsx,.xlsm,.csv,.txt,text/csv"></div>'+
      '<div class="imp-sample"><p style="margin-bottom:6px"><b>Format attendu :</b> le nom de la dépense dans une colonne et son montant dans la colonne à côté. La date et la catégorie sont facultatives.</p>'+
      '<div class="imp-wrap"><table class="imp-table"><thead><tr><th>Dépense</th><th class="a">Montant</th></tr></thead><tbody><tr><td>Loyer</td><td class="a">700</td></tr><tr><td>Courses</td><td class="a">350</td></tr><tr><td>Abonnement mobile</td><td class="a">19,99</td></tr></tbody></table></div>'+
      '<p style="margin-top:6px">Les anciens fichiers .xls doivent être enregistrés en .xlsx ou en CSV depuis Excel.</p></div>'+
      '<div class="sheet-acts"><button class="btn" data-action="imp-close">Fermer</button></div>';
  }
  var b=impBuild(), data=imp.hasHeader?imp.rows.length-1:imp.rows.length, c=imp.cols, hdr=imp.hasHeader;
  function opts(sel,none){
    var h=none?'<option value="-1"'+(sel<0?' selected':'')+'>Aucune</option>':'';
    for(var j=0;j<imp.width;j++) h+='<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(colName(j,hdr,imp.rows))+'</option>';
    return h;
  }
  var months=''; for(var k=-18;k<=6;k++){var m=addMonths(realMonth,k); months+='<option value="'+m+'"'+(m===imp.month?' selected':'')+'>'+esc(monthLabel(m))+'</option>';}
  var rowsHtml=b.items.slice(0,8).map(function(x){
    var sign=x.type==='income'?'+':x.type==='expense'?'−':'→ ';
    return '<tr><td>'+esc(x.date?x.date.split('-').reverse().join('/'):'—')+'</td><td>'+esc(x.note)+'</td><td>'+esc(x.cat)+'</td><td class="a num">'+sign+eur(x.amount)+'</td></tr>';
  }).join('');
  var repeatHelp=imp.repeat==='none'?(c.date>=0?'Chaque ligne est ajoutée à sa date.':'Les lignes sont ajoutées au mois choisi, le 1er du mois.'):imp.repeat==='forward'?'Chaque ligne revient automatiquement chaque mois à partir du mois choisi (ou de sa date). Idéal pour les dépenses fixes.':'Chaque ligne revient sur tous les mois, y compris les 12 mois précédents.';
  return '<p class="muted">Fichier : <b>'+esc(imp.name||'sans nom')+'</b> · '+data+' ligne'+(data>1?'s':'')+' lue'+(data>1?'s':'')+'</p>'+
    '<label class="check"><input type="checkbox" data-imp="header" id="imp-header"'+(hdr?' checked':'')+'><span>La première ligne contient les titres des colonnes</span></label>'+
    '<div class="imp-grid">'+
      '<div class="field"><label for="imp-label">Nom de la dépense</label><select id="imp-label" data-imp="label">'+opts(c.label,false)+'</select></div>'+
      '<div class="field"><label for="imp-amount">Montant</label><select id="imp-amount" data-imp="amount">'+opts(c.amount,false)+'</select></div>'+
      '<div class="field"><label for="imp-date">Date (facultatif)</label><select id="imp-date" data-imp="date">'+opts(c.date,true)+'</select></div>'+
      '<div class="field"><label for="imp-cat">Catégorie (facultatif)</label><select id="imp-cat" data-imp="cat">'+opts(c.cat,true)+'</select></div>'+
      '<div class="field"><label for="imp-type">Ces lignes sont</label><select id="imp-type" data-imp="type"><option value="expense"'+(imp.type==='expense'?' selected':'')+'>Des dépenses</option><option value="income"'+(imp.type==='income'?' selected':'')+'>Des revenus</option><option value="saving"'+(imp.type==='saving'?' selected':'')+'>De l’épargne</option><option value="sign"'+(imp.type==='sign'?' selected':'')+'>Selon le signe (négatif = dépense)</option></select></div>'+
      (c.date<0||b.undated>0?'<div class="field"><label for="imp-month">Mois concerné</label><select id="imp-month" data-imp="month">'+months+'</select></div>':'')+
    '</div>'+
    '<div class="field"><label for="imp-repeat">Répétition</label><select id="imp-repeat" data-imp="repeat"><option value="none"'+(imp.repeat==='none'?' selected':'')+'>Ne pas répéter</option><option value="forward"'+(imp.repeat==='forward'?' selected':'')+'>Chaque mois, à partir de ce mois</option><option value="back"'+(imp.repeat==='back'?' selected':'')+'>Tous les mois, y compris les 12 mois précédents</option></select><p class="muted">'+esc(repeatHelp)+'</p></div>'+
    '<div><h3 style="margin-bottom:8px">Aperçu</h3>'+(b.items.length?'<div class="imp-wrap"><table class="imp-table"><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="a">Montant</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div><p class="muted" style="margin-top:8px">'+(b.items.length>8?'… et '+(b.items.length-8)+' autre'+(b.items.length-8>1?'s':'')+'. ':'')+b.items.length+' ligne'+(b.items.length>1?'s':'')+' à importer pour '+eur(b.sum)+(b.skipped?' · '+b.skipped+' ignorée'+(b.skipped>1?'s':'')+' (vides, totaux ou sans montant)':'')+'.'+(b.newCats.length?' Nouvelles catégories : '+esc(b.newCats.join(', '))+'.':'')+'</p>':'<p class="empty">Aucune ligne exploitable avec ces colonnes. Changez les colonnes choisies ci-dessus.</p>')+'</div>'+
    '<div class="sheet-acts"><button class="btn left" style="margin-right:auto" data-action="imp-open">Autre fichier</button><button class="btn" data-action="imp-close">Annuler</button><button class="btn primary" data-action="imp-run"'+(b.items.length?'':' disabled')+'>Importer '+b.items.length+' ligne'+(b.items.length>1?'s':'')+'</button></div>';
}
function impPaint(){$('#imp-body').innerHTML=impBodyHtml()}
function impOpen(){imp=null;impErr='';impPaint();$('#imp').hidden=false;lastFocus=document.activeElement;}
function impClose(){$('#imp').hidden=true;imp=null;impErr='';}
function impSet(inp){
  var k=inp.dataset.imp;
  if(k==='header') imp.hasHeader=inp.checked;
  else if(k==='label'||k==='amount'||k==='date'||k==='cat') imp.cols[k]=Number(inp.value);
  else imp[k]=inp.value;
  var id=inp.id; impPaint(); var el=document.getElementById(id); if(el&&el.focus) el.focus();
}
async function impLoad(file){
  try{
    var name=(file.name||'').toLowerCase(), buf=await file.arrayBuffer(), u=new Uint8Array(buf), rows;
    if(u[0]===0xD0&&u[1]===0xCF) throw new Error('xls');
    if(/\.ods$/.test(name)) throw new Error('xls');
    if(u[0]===0x50&&u[1]===0x4B) rows=await readXlsx(buf);
    else rows=parseCsv(decodeText(buf));
    imp=impInit(rows,file.name); impErr='';
  }catch(e){
    imp=null;
    impErr=e&&e.message==='xls'?'Ce fichier est dans un ancien format. Dans Excel : Fichier, Enregistrer sous, puis « Classeur Excel (.xlsx) » ou « CSV », et importez le nouveau fichier.':
      (typeof DecompressionStream==='undefined'?'Votre navigateur est trop ancien pour lire un .xlsx. Enregistrez le fichier en CSV depuis Excel (Fichier, Enregistrer sous, CSV) et importez-le.':'Impossible de lire ce fichier. Essayez de l’enregistrer en .xlsx ou en CSV depuis Excel, puis réimportez-le.');
  }
  impPaint();
}
function impRun(){
  if(!imp) return;
  var b=impBuild(); if(!b.items.length) return;
  var snap=JSON.stringify(state), added=0, dup=0, month=imp.month, repeat=imp.repeat, firstMonth=null;
  b.newCats.forEach(function(n){if(!state.cats.some(function(c){return c.n.toLowerCase()===n.toLowerCase()})) state.cats.splice(state.cats.length-1,0,{n:n,need:0});});
  var seen={}; state.tx.forEach(function(x){seen[[x.type,x.date,x.amount,(x.note||'').toLowerCase()].join('|')]=1});
  b.items.forEach(function(it){
    var from=it.date?monthOf(it.date):month;
    if(!firstMonth||from>firstMonth) firstMonth=from;
    if(repeat!=='none'){
      state.rec.push({id:uid(),type:it.type,cat:it.cat,amount:it.amount,note:it.note,day:it.date?Number(it.date.slice(8)):1,from:repeat==='back'?addMonths(from,-12):from,to:'',goal:''});
      added++;
    }else{
      var date=it.date||month+'-01', kk=[it.type,date,it.amount,it.note.toLowerCase()].join('|');
      if(seen[kk]){dup++;return;}
      seen[kk]=1; state.tx.push({id:uid(),type:it.type,cat:it.cat,amount:it.amount,date:date,note:it.note,goal:''}); added++;
    }
  });
  save(); impClose();
  cur=firstMonth||cur; filter='all'; query='';
  goTab('tx');
  toast(added+' ligne'+(added>1?'s':'')+' importée'+(added>1?'s':'')+(repeat!=='none'?' (répétées chaque mois)':'')+(dup?' · '+dup+' doublon'+(dup>1?'s':'')+' ignoré'+(dup>1?'s':''):''),function(){state=normalize(JSON.parse(snap));save();render();});
}
$('#imp').addEventListener('click',function(e){if(e.target===$('#imp')) impClose();});
$('#imp').addEventListener('dragover',function(e){e.preventDefault();});
$('#imp').addEventListener('drop',function(e){e.preventDefault(); var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) impLoad(f);});

/* ====================== Démarrage ====================== */
(function(){var h=location.hash.slice(1); if(views[h]) tab=h;})();
applyTheme();
render();
})();
</script>
